name: Verify SEO incident monitor
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo
      - run: npm run workflow
      - run: git diff --exit-code -- evidence workflows
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-seo-incident-evidence
          path: evidence/
